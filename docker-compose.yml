services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      GEO_UPLOAD_DIR: /app/uploads
      GEO_DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

  # Run with: docker compose run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]

volumes:
  uploads:
  data:
